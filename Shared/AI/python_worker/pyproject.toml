[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usm-shared-ai-worker"
version = "0.1.0"
description = "Persistent Python worker for Shared.AI"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
all = [
  "numpy>=1.26",
  "sentence-transformers>=3.0.0",
  "transformers>=4.43.0",
  "spacy>=3.7.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["usm_shared_ai*"]

