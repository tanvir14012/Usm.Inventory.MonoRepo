# =============================================================================
#  Usm.Inventory CDN – Nginx Edge Proxy (Alpine Linux)
#  Optimised for: static asset serving, HLS video, Nginx MD5 secure links.
#
#  Prerequisites (Alpine Dockerfile):
#    RUN apk add --no-cache nginx
#    COPY nginx/nginx.conf /etc/nginx/nginx.conf
#
#  Nginx modules required (all included in the standard nginx Alpine package):
#    • ngx_http_secure_link_module  (--with-http_secure_link_module)
#    • ngx_http_gzip_module
#    • ngx_http_stub_status_module  (for health endpoint)
#
#  Secure-link MD5 format (MUST match NginxSecureLinkGenerator.cs):
#    Without IP: "{expires}{uri} {secret_key}"
#    With IP:    "{expires}{uri}{remote_addr} {secret_key}"
#
#  Shell test (without IP binding):
#    SECRET="change-me-in-production"
#    EXPIRES=$(date -d "+1 hour" +%s)
#    URI="/cdn/assets/logo.png"
#    SIG=$(printf '%s' "${EXPIRES}${URI} ${SECRET}" | openssl md5 -binary | openssl base64 | tr +/ -_ | tr -d =)
#    echo "?md5=${SIG}&expires=${EXPIRES}"
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use  epoll;             # Linux edge-triggered I/O (available in Alpine)
    multi_accept  on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format  cdn  '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time '
                     'cache=$upstream_cache_status';

    access_log  /var/log/nginx/access.log  cdn;

    # ── High-performance file serving ────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;    # Batch TCP packets (requires sendfile)
    tcp_nodelay         on;    # Low-latency for keep-alive connections
    keepalive_timeout   65;
    keepalive_requests  1000;

    # Cache open file descriptors to avoid repeated open()/stat() syscalls
    open_file_cache           max=10000 inactive=20s;
    open_file_cache_valid     30s;
    open_file_cache_min_uses  2;
    open_file_cache_errors    on;

    # ── Client limits ─────────────────────────────────────────────────────────
    client_max_body_size        0;     # Unlimited – chunked upload handled by Kestrel
    client_body_timeout         60s;
    client_header_timeout       20s;
    send_timeout                60s;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-mpegURL   # HLS playlists
        image/svg+xml
        font/woff2;

    # ── Buffer tuning ─────────────────────────────────────────────────────────
    proxy_buffers          16 64k;
    proxy_buffer_size      64k;
    proxy_read_timeout     300s;
    proxy_send_timeout     300s;
    proxy_connect_timeout  10s;

    # ── Upstream: Kestrel (.NET 10 application) ───────────────────────────────
    upstream kestrel {
        server  127.0.0.1:5000;
        keepalive 64;
    }

    # =========================================================================
    #  HTTP → HTTPS redirect (remove this block if TLS terminates upstream)
    # =========================================================================
    server {
        listen       80  default_server;
        listen  [::]:80  default_server;
        server_name  _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    #  Main CDN server (HTTPS)
    # =========================================================================
    server {
        listen       443  ssl  http2  default_server;
        listen  [::]:443  ssl  http2  default_server;
        server_name  cdn.example.com;        # ← Replace with your domain

        # ── TLS ───────────────────────────────────────────────────────────────
        ssl_certificate      /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key  /etc/nginx/certs/privkey.pem;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers  off;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  1d;
        ssl_session_tickets  off;
        add_header           Strict-Transport-Security  "max-age=63072000"  always;

        # ── Security headers ──────────────────────────────────────────────────
        add_header  X-Content-Type-Options   "nosniff"         always;
        add_header  X-Frame-Options          "DENY"            always;
        add_header  X-XSS-Protection         "1; mode=block"   always;
        add_header  Referrer-Policy          "strict-origin"   always;

        # ── Root for locally stored static assets ─────────────────────────────
        root  /var/cdn/storage;

        # =========================================================================
        #  /cdn/secure/  –  Nginx MD5 Secure Link protected assets (WITHOUT IP binding)
        #
        #  C# hash input: "{expires}{uri} {secret}"
        #    e.g. "1893456000/cdn/secure/video.mp4 my-secret-key"
        #
        #  URL format: /cdn/secure/video.mp4?md5=BASE64URL&expires=UNIX_TS
        #
        #  Validation results:
        #    $secure_link = ""  → hash mismatch  → 403 Forbidden
        #    $secure_link = "0" → token expired   → 410 Gone
        #    $secure_link = "1" → valid           → serve file
        # =========================================================================
        location /cdn/secure/ {
            # Replace "change-me-in-production" with the value from CDN:SecureLink:SecretKey
            secure_link      $arg_md5,$arg_expires;
            secure_link_md5  "$secure_link_expires$uri change-me-in-production";

            if ($secure_link = "") {
                return 403;   # Invalid/tampered token
            }
            if ($secure_link = "0") {
                return 410;   # Expired token
            }

            # Strip the /cdn/secure prefix and serve from storage root
            alias  /var/cdn/storage/;

            expires           7d;
            add_header        Cache-Control   "public, max-age=604800, immutable";
            add_header        Vary            "Accept-Encoding";
            add_header        X-CDN-Strategy  "secure-link-no-ip";

            # Enable byte-range for video seeking
            add_header        Accept-Ranges   bytes;
        }

        # =========================================================================
        #  /cdn/secure-ip/  –  Nginx MD5 Secure Link WITH client IP binding
        #
        #  C# hash input: "{expires}{uri}{remoteAddr} {secret}"
        #    e.g. "1893456000/cdn/secure-ip/video.mp4192.168.1.100 my-secret-key"
        #
        #  Note: NO space between $uri and $remote_addr (Nginx concatenates variables directly).
        #        This MUST match NginxSecureLinkOptions.BindToClientIp = true in C#.
        # =========================================================================
        location /cdn/secure-ip/ {
            secure_link      $arg_md5,$arg_expires;
            secure_link_md5  "$secure_link_expires$uri$remote_addr change-me-in-production";

            if ($secure_link = "") {
                return 403;
            }
            if ($secure_link = "0") {
                return 410;
            }

            alias  /var/cdn/storage/;

            expires           1h;
            add_header        Cache-Control   "private, max-age=3600";
            add_header        X-CDN-Strategy  "secure-link-ip-bound";
            add_header        Accept-Ranges   bytes;
        }

        # =========================================================================
        #  /cdn/assets/  –  Public static assets (images, CSS, JS, fonts)
        #  No secure-link required – cache aggressively.
        # =========================================================================
        location /cdn/assets/ {
            alias  /var/cdn/storage/assets/;

            expires           365d;
            add_header        Cache-Control   "public, max-age=31536000, immutable";
            add_header        Vary            "Accept-Encoding";
            add_header        X-CDN-Strategy  "public-static";

            # Return 404 cleanly instead of a directory listing
            autoindex  off;

            # Serve pre-compressed .gz files if the client supports them
            gzip_static  on;
        }

        # =========================================================================
        #  /cdn/hls/  –  HLS (HTTP Live Streaming) manifests and .ts segments
        # =========================================================================
        location /cdn/hls/ {
            alias  /var/cdn/storage/hls/;

            expires           10s;    # Playlists update frequently
            add_header        Cache-Control  "no-cache";
            add_header        Access-Control-Allow-Origin  "*";
            add_header        Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header        Accept-Ranges  bytes;

            # .ts segments can be cached longer
            location ~* \.ts$ {
                expires           1h;
                add_header        Cache-Control  "public, max-age=3600";
            }
        }

        # =========================================================================
        #  /api/cdn/  –  Proxy to Kestrel (.NET 10) for:
        #   • Adaptive image processing  (?w=800&h=600&fmt=webp)
        #   • Upload API  (POST /api/cdn/upload/*)
        #   • Cache invalidation  (DELETE /api/cdn/asset/*)
        #   • Upload status polling  (GET /api/cdn/upload/{id}/status)
        # =========================================================================
        location /api/cdn/ {
            proxy_pass         http://kestrel;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";       # Enable keep-alive to upstream
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Required for byte-range streaming: disable buffering so the client
            # receives data as Kestrel flushes the PipeWriter.
            proxy_buffering    off;
            proxy_request_buffering  off;
        }

        # =========================================================================
        #  Health check endpoint (used by Docker/K8s liveness probes)
        # =========================================================================
        location = /health {
            stub_status;
            access_log  off;
            allow       127.0.0.1;
            allow       10.0.0.0/8;
            allow       172.16.0.0/12;
            allow       192.168.0.0/16;
            deny        all;
        }

        # ── Custom error pages ────────────────────────────────────────────────
        error_page  403  /errors/403.html;
        error_page  404  /errors/404.html;
        error_page  410  /errors/410.html;
        error_page  500 502 503 504  /errors/50x.html;

        location ^~ /errors/ {
            internal;
            root  /var/cdn/static;
        }
    }
}
