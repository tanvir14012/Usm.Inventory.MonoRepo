apiVersion: v1
kind: ConfigMap
metadata:
  name: python-ai-worker-config
  namespace: usm-platform
data:
  appsettings.json: |
    {
      "worker_id": "k8s-worker",
      "pool_name": "cpu",
      "role": "Cpu",
      "protocol_version": 1,
      "minimum_python_version": "3.10",
      "warmup_models": false,
      "models": [
        { "name": "sentence-transformers/all-MiniLM-L6-v2", "role": "Cpu" },
        { "name": "en_core_web_sm", "role": "Nlp" }
      ],
      "custom_functions": [
        { "operation": "math.add", "module": "test_fixtures.math_ops", "function": "add", "model": null }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-ai-worker
  namespace: usm-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-ai-worker
  template:
    metadata:
      labels:
        app: python-ai-worker
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: python-ai-worker
          image: usmregistry.azurecr.io/python-ai-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: USM_SHARED_AI_CONFIG_FILE
              value: /app/config/appsettings.json
            - name: USM_SHARED_AI_READY_FILE
              value: /tmp/usm-shared-ai.ready
          volumeMounts:
            - name: config
              mountPath: /app/config
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "kill -TERM 1 && sleep 5"]
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -f /tmp/usm-shared-ai.ready"]
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "test -f /tmp/usm-shared-ai.ready"]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: python-ai-worker-config
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: python-ai-worker
  namespace: usm-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: python-ai-worker

