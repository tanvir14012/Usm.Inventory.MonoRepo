user nginx;
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  client_max_body_size 20m;
  server_tokens off;

  limit_req_zone $binary_remote_addr zone=api_limit:20m rate=100r/s;
  limit_conn_zone $binary_remote_addr zone=conn_limit:20m;

  log_format json_combined escape=json
    '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request":"$request",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"http_user_agent":"$http_user_agent",'
    '"trace_id":"$http_x_correlation_id"'
    '}';
  access_log /dev/stdout json_combined;
  error_log /dev/stderr warn;

  ssl_protocols TLSv1.3;
  ssl_session_cache shared:SSL:20m;
  ssl_session_timeout 10m;
  ssl_prefer_server_ciphers off;

  map $ssl_client_s_dn $client_cert_dn {
    default $ssl_client_s_dn;
    "" "unavailable";
  }

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

  include /etc/nginx/conf.d/*.conf;
}

