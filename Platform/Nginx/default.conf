upstream frontend_upstream {
  server frontend:80;
  keepalive 64;
}

upstream gateway_upstream {
  server api-gateway:8080;
  keepalive 128;
}

server {
  listen 80;
  listen [::]:80;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name _;

  ssl_certificate /etc/nginx/ssl/server.crt;
  ssl_certificate_key /etc/nginx/ssl/server.key;
  ssl_client_certificate /etc/nginx/ssl/ca.crt;
  ssl_verify_client optional_no_ca;
  ssl_verify_depth 2;

  error_page 400 401 403 /security-error.json;
  error_page 404 /404.html;
  error_page 429 /rate-limit.json;
  error_page 500 502 503 504 /50x.html;

  location = /security-error.json {
    default_type application/json;
    return 403 '{"error":"enterprise_client_identity_validation_failed"}';
  }

  location = /rate-limit.json {
    default_type application/json;
    return 429 '{"error":"too_many_requests"}';
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location /api/ {
    limit_req zone=api_limit burst=200 nodelay;
    limit_conn conn_limit 200;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $request_id;
    proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
    proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
    proxy_set_header X-FIDO2-Auth $http_x_fido2_auth;
    proxy_pass http://gateway_upstream;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $request_id;
    proxy_pass http://frontend_upstream;
  }
}

