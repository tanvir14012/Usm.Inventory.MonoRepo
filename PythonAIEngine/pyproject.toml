[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-ai-engine"
version = "1.0.0"
description = "Extensible gRPC AI engine for .NET clients"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.66.0",
  "grpcio-health-checking>=1.66.0",
  "protobuf>=5.27.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
ml = [
  "sentence-transformers>=3.0.0",
  "transformers>=4.44.0",
  "torch>=2.5.0",
  "accelerate>=0.33.0",
]

[project.scripts]
python-ai-engine = "python_ai_engine.server:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["python_ai_engine*"]

